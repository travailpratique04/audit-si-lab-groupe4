
name: audit-continu

on:
  push:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Fichiers sensibles versionnes
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$|serviceAccount.*\.json$'; then
            echo "::error::Fichier sensible versionne"
            exit 1
          fi

      - name: Regles Firebase dangereuses
        run: |
          if grep -R "allow read, write: if true" . --include="*.rules"; then
            echo "::error::Regle Firebase trop ouverte"
            exit 1
          fi
